[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-classifier"
version = "0.1.0"
description = "Logistic regression classifier for the Iris dataset"
readme = "README.md"
license = "MIT"
authors = [{ name = "Semanu Kwaku Sebuava" }]
requires-python = ">=3.10"
dependencies = ["scikit-learn", "matplotlib", "numpy"]

[project.scripts]
iris-train = "iris_classifier.model:main"